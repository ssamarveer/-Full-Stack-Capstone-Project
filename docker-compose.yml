services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: spendwise
      POSTGRES_USER: spendwise
      POSTGRES_PASSWORD: spendwise
    ports: ["5432:5432"]
    volumes: ["spendwise_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spendwise -d spendwise"]
      interval: 5s
      timeout: 5s
      retries: 15
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/spendwise
      DB_USERNAME: spendwise
      DB_PASSWORD: spendwise
      JWT_SECRET: SpendWiseLocalDevelopmentSecretKeyChangeBeforeDeployment2026
      JWT_EXPIRATION: 86400000
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8080
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  spendwise_pg:
